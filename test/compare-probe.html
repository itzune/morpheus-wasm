<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>compare</title></head>
<body><pre id="out"></pre>
<script type="module">
const out = document.getElementById('out');
const log = (...a) => { out.textContent += a.join(' ') + '\n'; console.log(...a); };

const v = '3.5.1';
const CDN = `https://cdn.jsdelivr.net/npm/@wllama/wllama@${v}`;
const { Wllama } = await import(`${CDN}/esm/index.js`);
const w = new Wllama({ 'default': `${CDN}/src/wasm/wllama.wasm` });
await w.loadModelFromUrl('http://127.0.0.1:8765/model/morpheus-v2-mamba.Q4_K_M.wllama.gguf', { n_ctx: 2048 });

// Mirror the demo's greedy params as closely as wllama allows:
//   max_tokens=3, temp=0, top_p=1, top_k=0, repeat_penalty=1.1, n_probs=5
const PROMPTS = ['Kaixo, zer ', 'Nire izena ', 'Euskal Herria ', 'Gaur egun, euskara ', 'Bihar joango naiz '];
for (const p of PROMPTS) {
  // 1) string prompt (what app.js currently does) — uses llama.cpp's built-in tokenizer
  const r = await w.createCompletion({
    prompt: p, max_tokens: 3, temperature: 0, top_p: 1.0, top_k: 0,
    repeat_penalty: 1.1, n_probs: 5, stream: false,
  });
  log(`STRING  ${JSON.stringify(p)} → ${JSON.stringify(r.choices?.[0]?.text ?? '')}`);
}
log('DONE');
</script>
</body></html>
