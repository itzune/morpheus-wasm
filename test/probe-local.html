<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>wllama local probe</title></head>
<body>
<pre id="out"></pre>
<script type="module">
const out = document.getElementById('out');
const log = (...a) => { out.textContent += a.join(' ') + '\n'; console.log(...a); };

const v = new URLSearchParams(location.search).get('v') || '3.5.1';
const url = new URLSearchParams(location.search).get('url');
log('=== wllama@' + v + (url ? '  local url' : '  HF') + ' ===');

const CDN = `https://cdn.jsdelivr.net/npm/@wllama/wllama@${v}`;
const { Wllama } = await import(`${CDN}/esm/index.js`);
log('libllama:', Wllama.getLibllamaVersion());

const w = new Wllama({ 'default': `${CDN}/src/wasm/wllama.wasm` });
log('WebGPU:', w.isSupportWebGPU());

try {
  if (url) {
    await w.loadModelFromUrl(url, { n_ctx: 2048 });
  } else {
    await w.loadModelFromHF(
      { repo: 'itzune/morpheus-gguf', file: 'morpheus-v2-mamba.Q4_K_M.gguf' },
      { n_ctx: 2048 }
    );
  }
  const meta = w.getModelMetadata();
  log('LOADED OK. arch:', meta.meta?.['general.architecture'],
      '| vocab:', meta.hparams?.nVocab, '| layers:', meta.hparams?.nLayer,
      '| add_bos:', w.mustAddBosToken());

  const prompts = ['Kaixo, zer ', 'Nire izena ', 'Euskal Herria '];
  for (const p of prompts) {
    const r = await w.createCompletion({ prompt: p, max_tokens: 16, temperature: 0, top_p: 1.0, stream: false });
    log(`COMPLETION ${JSON.stringify(p)} → ${JSON.stringify(r.choices?.[0]?.text ?? '')}`);
  }
  log('RESULT: SUCCESS');
} catch (e) {
  log('ERROR:', e?.message || e);
  log('RESULT: FAILURE');
}
</script>
</body></html>
